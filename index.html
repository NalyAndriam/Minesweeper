<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper - Choose Grid Size</title>
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <h1>Minesweeper - Choose Grid Size</h1>
    <div class="options">
        <div class="option">
            <button onclick="startGame(8, 8, 8, 'single')">Small (8x8, 8 mines)</button>
        </div>
        <div class="option">
            <button onclick="startGame(10, 10, 10, 'single')">Medium (10x10, 10 mines)</button>
        </div>
        <div class="option">
            <button onclick="startGame(12, 12, 12, 'single')">Large (12x12, 12 mines)</button>
        </div>
        <div class="option">
            <button onclick="startGame(10, 10, 10, 'two')">Two Players (10x10, 10 mines)</button>
        </div>
    </div>
    <script>
        function startGame(rows, cols, mines, mode) {
            window.location.href = `game.html?rows=${rows}&cols=${cols}&mines=${mines}&mode=${mode}`;
        }
    </script>
</body>
</html>
