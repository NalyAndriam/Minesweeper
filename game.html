<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <link href="assets/css/style.css" rel="stylesheet">
    <style>
        #game-info {
            margin-bottom: 20px;
            font-size: 20px;
            display: flex;
            gap: 30px;
            align-items: center;
            font-weight: bold;
        }
        #player-scores {
            display: flex;
            gap: 20px;
        }
        .player-score {
            padding: 5px 10px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .player1 {
            color: #1e90ff; /* Bleu pour Joueur 1 */
        }
        .player2 {
            color: #ff4500; /* Rouge pour Joueur 2 */
        }
        .active-player {
            border: 2px solid #ffd700; /* Bordure dorée pour le joueur actif */
            background-color: rgba(255, 215, 0, 0.1); /* Fond léger */
        }
        #turn-timer, #flags-remaining, #timer {
            padding: 5px 10px;
            border-radius: 5px;
            background-color: #f5f5f5;
        }
        .home-link {
            margin-top: 10px;
            text-align: center;
        }
        .home-link a {
            color: #4CAF50;
            text-decoration: none;
            font-size: 16px;
        }
        .home-link a:hover {
            text-decoration: underline;
        }
        #game-over-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }
        #game-over-popup button {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #game-over-popup button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div id="game-info">
        <div id="player-scores">
            <span id="player1-score" class="player-score player1">Player 1: 0</span>
            <span id="player2-score" class="player-score player2">Player 2: 0</span>
        </div>
        <span id="turn-timer"></span>
        <span id="flags-remaining">Mines remaining: 10</span>
        <span id="timer">Time: 0s</span>
    </div>
    <div id="game-board"></div>
    <div class="home-link">
        <a href="index.html">Back to Home</a>
    </div>
    <div id="game-over-popup">
        <h2>Game Over!</h2>
        <button onclick="restartGame()">Restart</button>
        <button onclick="goToIndex()">Back to Home</button>
    </div>
    <script src="assets/js/game.js"></script>
</body>
</html>
